spring:
  # ============================================================
  # APPLICATION
  # ============================================================

  # Name used to identify this microservice
  application:
    name: user-account-service


  # ============================================================
  # DATABASE
  # ============================================================

  # PostgreSQL database connection
  datasource:
    # PostgreSQL + host + port + database name
    url: ${DB_URL_ACCOUNT}

    # PostgreSQL username
    username: ${DB_USERNAME}

    # Database password
    # In production, use an environment variable instead
    password: ${DB_PASSWORD}


  # ============================================================
  # JPA / HIBERNATE
  # ============================================================

  jpa:
    hibernate:
      # Automatically update database tables based on entities
      ddl-auto: update


  # ============================================================
  # KAFKA
  # ============================================================

  # Kafka producer configuration
  kafka:
    # Address of the Kafka broker
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:

      # Convert Java String → Kafka message key
      key-serializer: org.apache.kafka.common.serialization.StringSerializer

      # Convert Java object → JSON
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

      properties:

        # Include Java type information in the JSON message
        # This helps the Kafka consumer know what type of
        # object was sent.
        spring.json.add.type: true

    # Kafka consumer configuration
    consumer:
      # Consumer group name.
      # All instances of the user-account-service using this group
      # share the Kafka messages between them.
      group-id: account-group

      # If this consumer group has no committed offset,
      # start reading from the earliest available message.
      auto-offset-reset: earliest

      # Kafka automatically commits the consumer offset.
      # This is currently kept simple for the local setup.
      enable-auto-commit: true

      # Kafka message keys are plain strings.
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer

      # We use ErrorHandlingDeserializer as a wrapper around
      # JsonDeserializer so deserialization errors can be handled
      # by Spring Kafka's error-handling mechanism.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

    properties:

      # Tell ErrorHandlingDeserializer which actual deserializer
      # should be used for the message value.
      #
      # Our Kafka messages contain JSON, so we use JsonDeserializer.
      spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer

      # The Outbox Publisher sends the JSON as a String.
      #
      # Because of this, the Kafka message does NOT contain
      # Spring's Java type information header.
      #
      # Therefore, we explicitly tell JsonDeserializer which Java
      # class should be created from the JSON message.
      spring.json.value.default.type: com.buuchezo.useraccountservice.kafka.dto.BalanceUpdateEvent

      # Only allow JSON to be deserialized into classes from
      # this package.
      #
      # This is a security measure that prevents arbitrary Java
      # classes from being deserialized from Kafka messages.
      spring.json.trusted.packages: com.buuchezo.useraccountservice.kafka.dto


# ============================================================
# SERVER
# ============================================================

# Port used by the user-account-service
server:
  port: 8080


# ============================================================
# ACTUATOR
# ============================================================

# Spring Boot Actuator for monitoring and health checks
management:
  endpoints:
    web:

      # Expose all actuator endpoints
      exposure:
        include: health,info


# ============================================================
# EUREKA
# ============================================================

# Eureka service discovery configuration
eureka:
  client:

    # Register this service with Eureka
    register-with-eureka: true

    # Discover other services registered with Eureka
    fetch-registry: true

    # Address of the Eureka server
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:

    # Register the service using its IP address
    prefer-ip-address: true

    # Create a unique ID for this service instance
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}


# ============================================================
# JWT
# ============================================================

jwt:

  # Secret key used to sign and verify JWT tokens
  #
  # The same secret must be available when creating
  # and validating the token.
  #
  # IMPORTANT:
  # Do not commit the real secret to GitHub.
  # Use an environment variable in production.
  secret: ${JWT_SECRET}

  # How long the JWT remains valid
  #
  # Value is in milliseconds:
  # 86,400,000 ms = 24 hours = 1 day

  expiration: ${EXPIRATION}

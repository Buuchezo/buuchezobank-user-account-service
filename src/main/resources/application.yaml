spring:
  # ============================================================
  # APPLICATION
  # ============================================================

  # Name used to identify this microservice
  application:
    name: user-account-service


  # ============================================================
  # DATABASE
  # ============================================================

  # PostgreSQL database connection
  datasource:
    # PostgreSQL + host + port + database name
    url: ${DB_URL_ACCOUNT}

    # PostgreSQL username
    username: ${DB_USERNAME}

    # Database password
    # In production, use an environment variable instead
    password: ${DB_PASSWORD}


  # ============================================================
  # JPA / HIBERNATE
  # ============================================================

  jpa:
    hibernate:
      # Automatically update database tables based on entities
      ddl-auto: update


  # ============================================================
  # KAFKA
  # ============================================================

  # Kafka producer configuration
  kafka:
    # Address of the Kafka broker
    bootstrap-servers: localhost:9092

    producer:

      # Convert Java String → Kafka message key
      key-serializer: org.apache.kafka.common.serialization.StringSerializer

      # Convert Java object → JSON
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

      properties:

        # Include Java type information in the JSON message
        # This helps the Kafka consumer know what type of
        # object was sent.
        spring.json.add.type: true

    # Kafka consumer configuration
    consumer:

      # Consumer group used by this service
      group-id: account-group

      # If no offset exists, start reading from the oldest message
      auto-offset-reset: earliest

      # Automatically commit consumed message offsets
      enable-auto-commit: true

      # Convert Kafka message key → Java String
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer

      # Handles errors when converting Kafka JSON into a Java object
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

      properties:

        # Use JsonDeserializer to convert JSON → Java object
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer

        # Map the event class from the producer service
        # to the equivalent event class in this service
        #
        # Producer class → Consumer class
        spring.json.type.mapping: >-
          com.buuchezo.transactionservice.kafka.dto.BalanceUpdateEvent:
          com.buuchezo.useraccountservice.kafka.dto.BalanceUpdateEvent


# ============================================================
# SERVER
# ============================================================

# Port used by the user-account-service
server:
  port: 8080


# ============================================================
# ACTUATOR
# ============================================================

# Spring Boot Actuator for monitoring and health checks
management:
  endpoints:
    web:

      # Expose all actuator endpoints
      exposure:
        include: "*"


# ============================================================
# EUREKA
# ============================================================

# Eureka service discovery configuration
eureka:
  client:

    # Register this service with Eureka
    register-with-eureka: true

    # Discover other services registered with Eureka
    fetch-registry: true

    # Address of the Eureka server
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:

    # Register the service using its IP address
    prefer-ip-address: true

    # Create a unique ID for this service instance
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}


# ============================================================
# JWT
# ============================================================

jwt:

  # Secret key used to sign and verify JWT tokens
  #
  # The same secret must be available when creating
  # and validating the token.
  #
  # IMPORTANT:
  # Do not commit the real secret to GitHub.
  # Use an environment variable in production.
  secret: ${JWT_SECRET}

  # How long the JWT remains valid
  #
  # Value is in milliseconds:
  # 86,400,000 ms = 24 hours = 1 day

  expiration: ${EXPIRATION}
